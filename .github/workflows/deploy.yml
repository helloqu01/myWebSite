# .github/workflows/deploy.yml
name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      resume_public:
        description: "이력서 공개 상태 (true=공개, false=비공개)"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      portfolio_public:
        description: "노묘 건강관리 외 페이지 공개 상태 (true=공개, false=비밀번호 보호)"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  deploy-web:
    name: "→ Frontend: Next.js → S3 + CloudFront"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies (web)
        working-directory: front
        run: npm ci

      - name: Verify web dependencies
        working-directory: front
        run: |
          npm audit --omit=dev --audit-level=high
          npm run lint
          npm test

      - name: Build (web)
        working-directory: front
        env:
          NEXT_PUBLIC_ADSENSE_CLIENT: ${{ secrets.NEXT_PUBLIC_ADSENSE_CLIENT }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_CLARITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_CLARITY_PROJECT_ID }}
          NEXT_PUBLIC_RESUME_PUBLIC: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_public || vars.RESUME_PUBLIC || 'false' }}
          NEXT_PUBLIC_PORTFOLIO_PUBLIC: ${{ github.event_name == 'workflow_dispatch' && inputs.portfolio_public || vars.PORTFOLIO_PUBLIC || 'false' }}
          NEXT_PUBLIC_RESUME_ACCESS_HASH: ${{ secrets.RESUME_ACCESS_HASH }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || '/api' }}
        run: npm run build
        

      - name: Sync to S3
        env:
          BUCKET: ${{ secrets.S3_BUCKET_NAME }}
        run: aws s3 sync front/out/ s3://$BUCKET --delete

      - name: Upload static route entry objects
        env:
          BUCKET: ${{ secrets.S3_BUCKET_NAME }}
        run: bash scripts/upload-static-route-entries.sh front/out "$BUCKET"

      - name: Configure private S3 and CloudFront routes
        env:
          DISTRIBUTION_ID: ${{ secrets.CF_DISTRIBUTION_ID }}
          BUCKET: ${{ secrets.S3_BUCKET_NAME }}
          API_ORIGIN_DOMAIN: ${{ secrets.API_ORIGIN_DOMAIN }}
        run: bash scripts/configure-cloudfront.sh "$DISTRIBUTION_ID" "$BUCKET" "$API_ORIGIN_DOMAIN"

      - name: Invalidate CloudFront
        env:
          DISTRIBUTION_ID: ${{ secrets.CF_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $DISTRIBUTION_ID \
            --paths "/*"

  deploy-api:
    name: "→ Backend: NestJS → Lambda (SAM)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: back/package-lock.json

      - name: Install dependencies (api)
        working-directory: back
        run: npm ci

      - name: Verify API dependencies and tests
        working-directory: back
        run: |
          npm audit --omit=dev --audit-level=high
          npm run lint
          npm test -- --runInBand

      - name: Build (api)
        working-directory: back
        run: |
          npm run build
          npm prune --production
          cp -R node_modules dist/

      - name: Package for SAM
        working-directory: back
        run: |
          sam package \
            --template-file template.yaml \
            --s3-bucket ${{ secrets.SAM_ARTIFACTS_BUCKET }} \
            --output-template-file packaged.yaml


      - name: Deploy with SAM
        working-directory: back
        run: |
          sam deploy \
            --template-file packaged.yaml \
            --stack-name ${{ secrets.STACK_NAME }} \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              AllowedOrigin=https://codingbyohj.com \
              SmtpUser='${{ secrets.SMTP_USER }}' \
              SmtpPass='${{ secrets.SMTP_PASS }}' \
              EmailFrom='${{ secrets.EMAIL_FROM }}' \
              EmailTo='${{ secrets.EMAIL_TO }}'
